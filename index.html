<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бақылау жұмысына вариант генераторы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 Мұғалімге арналған Вариант Генераторы</h1>
        
        <!-- Сұрақтарды топтап қосу бөлімі -->
        <div class="card">
            <h3>1. Сұрақтар мен тесттерді қосу</h3>
            <p class="hint">Сұрақтарды немесе жауап варианттары бар тесттерді Word-тан бірден көшіріп (paste) қойыңыз (Әр жаңа сұрақтың арасын бос жолмен бөліңіз):</p>
            
            <textarea id="questionInput" rows="8" placeholder="Мысалы:&#10;&#10;1. Қазақстанның астанасы қай қала?&#10;A) Алматы&#10;B) Астана&#10;C) Шымкент&#10;&#10;2. 5 + 5 неге тең?&#10;A) 10&#10;B) 12"></textarea>
            
            <button onclick="addQuestions()">Сұрақтарды базаға қосу</button>
            
            <p style="margin-top: 15px;">Базадағы сұрақтар саны: <strong id="totalQuestions">0</strong></p>
            
            <h4>Базадағы сұрақтар тізімі:</h4>
            <ul id="questionsList" class="questions-list"></ul>
        </div>

        <!-- Вариант жасау бөлімі -->
        <div class="card">
            <h3>2. Варианттарды генерациялау</h3>
            <label for="variantCount">Қанша вариант керек?</label>
            <input type="number" id="variantCount" min="1" max="10" value="2">
            
            <label for="questionsPerVariant">Әр вариантта қанша сұрақ болсын?</label>
            <input type="number" id="questionsPerVariant" min="1" max="10" value="3">
            
            <button onclick="generateVariants()" class="btn-generate">Варианттарды құрастыру</button>
        </div>

        <!-- Нәтиже шығатын жер -->
        <div id="output" class="output-section"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
